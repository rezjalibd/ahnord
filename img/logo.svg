    <circle cx="8" cy="55" r="2.5" fill="#59B9F9" />
    <circle cx="68" cy="55" r="2.5" fill="#936EE9" />
  </g>
  <!-- Typographic Wordmark -->
  <g transform="translate(105, 52)">
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5" fill="currentColor">
