      <stop offset="0%" stop-color="#008AFF" />
      <stop offset="50%" stop-color="#59B9F9" />
      <stop offset="100%" stop-color="#936EE9" />
    </linearGradient>
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#936EE9" stop-opacity="0.8" />
